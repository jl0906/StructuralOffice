name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install validation tools
        run: python -m pip install ruff
      - name: Static Python and complexity checks
        run: ruff check custom_components runtime_runner
      - name: Python syntax
        run: python -m compileall -q custom_components runtime_runner
      - name: JavaScript syntax
        run: node --check custom_components/backup_checkup/frontend/backup-checkup-panel.js
      - name: Frontend component version
        run: python .github/scripts/check_frontend_component.py
      - name: Frontend runtime render
        run: node .github/scripts/check_frontend_runtime.mjs
      - name: Runner cleanup behavior
        run: python .github/scripts/check_runner_cleanup.py
      - name: Async callback thread safety
        run: python .github/scripts/check_async_callbacks.py

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
